<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root { --fundo: #18181b; --linha: #2c2c33; --texto: #efeff1; --suave: #adadb8; --roxo: #9146ff; --roxo2: #bf94ff; --verde: #00c46b; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 320px; background: var(--fundo); color: var(--texto); font: 12.5px/1.35 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  .topo { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
  .topo img { width: 18px; height: 18px; border-radius: 4px; }
  .topo h1 { margin: 0; font-size: 13px; font-weight: 700; }
  .topo .conta { color: var(--suave); white-space: nowrap; }
  #botao { margin-left: auto; border: 1px solid var(--linha); background: #26262c; color: var(--texto); border-radius: 6px; padding: 3px 10px; font: inherit; font-weight: 600; cursor: pointer; }
  #botao.ligar { background: var(--roxo); border-color: var(--roxo); color: #fff; }
  #botao:disabled { opacity: .6; }
  #status { padding: 0 12px 8px; color: var(--suave); }
  #status b { color: var(--texto); font-weight: 600; }
  #lista { padding: 0 12px 10px; }
  .camp { color: var(--suave); font-size: 11px; margin: 8px 0 5px; }
  .item { display: grid; grid-template-columns: 22px 1fr; gap: 0 8px; align-items: center; margin-bottom: 5px; }
  .mini { width: 22px; height: 22px; border-radius: 4px; background: #26262c; object-fit: cover; grid-row: span 2; }
  .linha1 { display: flex; gap: 6px; min-width: 0; }
  .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .pct { color: var(--suave); font-variant-numeric: tabular-nums; }
  .pct.ok { color: var(--verde); font-weight: 700; }
  .barra { height: 3px; border-radius: 2px; background: var(--linha); overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--roxo2); }
  .barra i.ok { background: var(--verde); }
  .aviso { margin: 0 12px 10px; padding: 6px 8px; border-radius: 6px; background: #26262c; color: var(--suave); }
  .aviso a { color: var(--roxo2); text-decoration: none; }
  .secao { border-top: 1px solid var(--linha); padding: 8px 12px 10px; }
  .secao h2 { margin: 0 0 6px; font-size: 11px; font-weight: 600; color: var(--suave); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { border: 1px solid var(--linha); background: none; color: var(--suave); border-radius: 999px; padding: 2px 9px; font: inherit; font-size: 11.5px; cursor: pointer; }
  .chip.on { background: #2a1f45; border-color: var(--roxo); color: var(--texto); }
  details summary { cursor: pointer; color: var(--suave); font-size: 11px; font-weight: 600; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  #webhook { width: 100%; margin-top: 6px; background: #0e0e10; border: 1px solid var(--linha); border-radius: 6px; color: var(--texto); padding: 5px 7px; font: inherit; font-size: 11.5px; }
  #salvo { color: var(--verde); font-size: 11px; margin-left: 6px; }
  #anuncio { display: flex; gap: 8px; align-items: center; margin: 0 12px 10px; padding: 6px 8px; border-radius: 6px; background: #1f1f25; border: 1px solid var(--linha); color: var(--texto); text-decoration: none; }
  #anuncio img { width: 34px; height: 34px; border-radius: 5px; object-fit: cover; flex: none; }
  #anuncio small { display: block; color: #6b6b78; font-size: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="topo">
    <img src="icone.png" alt="">
    <h1 id="nome"></h1>
    <span class="conta" id="conta"></span>
    <button id="botao"></button>
  </div>
  <div id="status"></div>
  <div id="lista"></div>
  <div class="aviso" id="steam" hidden>🔗 <span id="steamTxt"></span> <a href="https://twitch.facepunch.com/connect" target="_blank">twitch.facepunch.com/connect</a></div>
  <a id="anuncio" target="_blank" hidden><img id="anuncioImg" alt=""><span><span id="anuncioTxt"></span><small id="patroc"></small></span></a>
  <div class="secao" id="secJogos" hidden><details><summary id="jogosTit"></summary><div class="chips" id="jogos" style="margin-top:6px"></div></details></div>
  <div class="secao"><details id="disc"><summary id="discTit"></summary><div id="discPassos" style="margin-top:6px;color:#adadb8;font-size:11px"></div><input id="webhook" type="url" spellcheck="false"><span id="salvo" hidden></span></details></div>
  <script src="textos.js"></script>
  <script src="painel.js"></script>
</body>
</html>
